name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    # Adds pipefail, so a check whose output is copied to a log with tee still fails its step.
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check
      - name: List the files nix fmt changes
        if: ${{ !cancelled() }}
        run: |
          nix fmt
          mkdir -p "$RUNNER_TEMP/checks"
          git status --porcelain > "$RUNNER_TEMP/checks/nix-fmt.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: checks-flake-check
          path: ${{ runner.temp }}/checks/
          if-no-files-found: ignore

  moon:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          mkdir -p "$RUNNER_TEMP/checks"
          nix develop --command moon check --target wasm --deny-warn 2>&1 | tee "$RUNNER_TEMP/checks/moon-check.log"
      - run: nix develop --command moon build --target wasm --release
      - run: nix develop --command moon test --target wasm --enable-coverage 2>&1 | tee "$RUNNER_TEMP/checks/moon-test.log"
      - name: Write the coverage report without files that have no instrumented lines
        run: |
          mkdir -p _build/coverage
          nix develop --command moon coverage report -f cobertura -o _build/coverage/cobertura.xml
          perl -0pi -e 's/ *<class [^>]*line-rate="-?nan">\s*<lines>\s*<\/lines>\s*<\/class>\n//g' _build/coverage/cobertura.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: _build/coverage/cobertura.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: checks-moon
          path: ${{ runner.temp }}/checks/
          if-no-files-found: ignore

  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command moon build --target wasm --release
      - run: |
          mkdir -p "$RUNNER_TEMP/checks"
          nix develop --command node scripts/check-golden.mjs 2>&1 | tee "$RUNNER_TEMP/checks/golden.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: checks-golden
          path: ${{ runner.temp }}/checks/
          if-no-files-found: ignore

  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command moon build --target wasm --release
      - run: |
          mkdir -p "$RUNNER_TEMP/checks"
          nix develop --command node scripts/check-stress.mjs 2>&1 | tee "$RUNNER_TEMP/checks/stress.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: checks-stress
          path: ${{ runner.temp }}/checks/
          if-no-files-found: ignore

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command moon build --target wasm --release
      - run: |
          mkdir -p "$RUNNER_TEMP/checks"
          nix develop --command node scripts/fuzz.mjs --count 500 2>&1 | tee "$RUNNER_TEMP/checks/fuzz.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: checks-fuzz
          path: ${{ runner.temp }}/checks/
          if-no-files-found: ignore

  typst:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop --command node scripts/build-typst.mjs
      - run: |
          mkdir -p "$RUNNER_TEMP/checks"
          nix develop --command node scripts/check-typst.mjs 2>&1 | tee "$RUNNER_TEMP/checks/typst.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: checks-typst
          path: ${{ runner.temp }}/checks/
          if-no-files-found: ignore

  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate the goldens from the pinned pele
        run: nix develop --command node scripts/gen-golden.mjs
      - name: Regenerate the flowchart golden cases from the goldens
        run: nix develop --command node scripts/gen-flowchart-golden-test.mjs
      - run: nix develop --command moon fmt
      - name: Fail when a generated file differs from the committed one
        run: |
          git status --short
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - name: List the files the regeneration changed
        if: ${{ !cancelled() }}
        run: |
          mkdir -p "$RUNNER_TEMP/checks"
          git status --porcelain > "$RUNNER_TEMP/checks/generated.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: checks-generated
          path: ${{ runner.temp }}/checks/
          if-no-files-found: ignore

  report:
    needs:
      # keep-sorted start
      - flake-check
      - fuzz
      - generated
      - golden
      - moon
      - stress
      - typst
      # keep-sorted end
    # Runs after a failed check too, so the comment shows which check failed; status-check still fails.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-nix
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          # A pattern, unlike a name, matches nothing without failing when the moon job uploaded no report.
          pattern: coverage
          path: _build/coverage
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: checks-*
          path: _build/checks
          merge-multiple: true
      - name: Table the checks for octocov
        run: node scripts/merge-checks.mjs _build/checks _build/checks.json
      - name: Expose Nix-provided octocov on PATH
        run: |
          nix develop --command bash <<'EOF' >> "$GITHUB_PATH"
          set -euo pipefail
          octocov_path="$(command -v octocov)"
          dirname "$octocov_path"
          EOF
      - name: Report coverage and the checks
        env:
          OCTOCOV_CUSTOM_METRICS_CHECKS: _build/checks.json
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1.5.2
        with:
          config: .github/octocov.yaml
          check-existence: true

  status-check:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs:
      # keep-sorted start
      - flake-check
      - fuzz
      - generated
      - golden
      - moon
      - report
      - stress
      - typst
      # keep-sorted end
    permissions: {}
    if: failure() || cancelled()
    steps:
      - run: exit 1
