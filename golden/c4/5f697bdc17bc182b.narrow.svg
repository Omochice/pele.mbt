b</tspan><tspan x="0" y="63.05">browser.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-component" data-id="c3" transform="translate(120,626.5)"><rect x="-108" y="-70.5" width="216" height="141" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-45.3" text-anchor="middle">«component»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-22.9">Security Component</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-1.95" text-anchor="middle">[Spring Bean]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="20.55">Provides functionality Related to</tspan><tspan x="0" y="37.55">signing in, changing passwords,</tspan><tspan x="0" y="54.55">etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-component" data-id="c2" transform="translate(120,847)"><rect x="-108" y="-62" width="216" height="124" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-36.8" text-anchor="middle">«component»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-14.4">Sign In Controller</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="6.55" text-anchor="middle">[Spring MVC Rest Controller]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="29.05">Allows users to sign in to the</tspan><tspan x="0" y="46.05">Internet Banking System.</tspan></text></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="c1-c2"><rect x="229.94" y="575.25" width="96.13" height="54" rx="3" fill="var(--_bg)"/><text style="fill:red;" text-anchor="middle" xml:space="preserve"><tspan x="278" y="588.3">1: Submits</tspan><tspan 