heir web</tspan><tspan x="0" y="67.55">browser.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-component" data-id="c3" transform="translate(120,655)"><rect x="-108" y="-75" width="216" height="150" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-49.8" text-anchor="middle">«component»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-27.4">Security Component</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-6.45" text-anchor="middle">[Spring Bean]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="17.55">Provides functionality Related to</tspan><tspan x="0" y="37.55">signing in, changing passwords,</tspan><tspan x="0" y="57.55">etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-component" data-id="c2" transform="translate(120,883)"><rect x="-108" y="-65" width="216" height="130" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-39.8" text-anchor="middle">«component»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-17.4">Sign In Controller</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="3.55" text-anchor="middle">[Spring MVC Rest Controller]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="27.55">Allows users to sign in to the</tspan><tspan x="0" y="47.55">Internet Banking System.</tspan></text></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="c1-c2"><rect x="229.94" y="600" width="96.13" height="60" rx="3" fill="var(--_bg)"/><text style="fill:red;" text-anchor="middle" xml:space="preserve"><tspan x="278" y="614.55">1: Submits</tspan><tspan x="278" y="634.55">credentials to</tspan></text><text class="pele-c4-techn" fill="var(--_m)" style="fill:red;" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="278" y="654.55">[JSON/HTTPS]</tspan></text></g><g class="pele-edge-label" data-id="c2-c3"><rect x="43.75" y="754" width="152.5" height="40" rx="3" fill="var(--_bg)"/><text style="fill:red;" text-anchor="middle" xml:space="preserve"><tspan x="120" y="768.55">2: Calls isAuthenticated()</tspan><tspan x="120" y="788.55">on</tspan></text></g><g class="pele-edge-label" data-id="c3-c4"><rect x="-97.35" y="341.5" width="94.7" height="80" rx="3" fill="var(--_bg)"/><text style="fill:red;" text-anchor="middle" xml:space="preserve"><tspan x="-50" y="356.05">3: select * from</tspan><tspan x="-50" y="376.05">users where</tspan><tspan x="-50" y="396.05">username = ?</tspan></text><text class="pele-c4-techn" fill="var(--_m)" style="fill:red;" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="-50" y="416.05">[JDBC]</tspan></text></g></g></g></svg>