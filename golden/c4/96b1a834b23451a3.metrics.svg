reserve"><tspan x="0" y="-7.4">E-Mail System</tspan></text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="17.55">The internal Microsoft</tspan><tspan x="0" y="37.55">Exchange system</tspan></text></g><g class="pele-node pele-shape-person pele-c4-person" data-id="customer" transform="translate(424,97)"><rect x="-108" y="-71" width="216" height="168" rx="12" fill="var(--_s)" stroke="var(--_b)"/><circle cy="-83" r="13" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-26.8" text-anchor="middle">«person»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.4">Customer</tspan></text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="20.55">A customer of the bank,</tspan><tspan x="0" y="40.55">with personal bank</tspan><tspan x="0" y="60.55">accounts</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-external_system pele-c4-external" data-id="banking_system" transform="translate(740,97)"><rect x="-108" y="-97" width="216" height="194" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-71.8" text-anchor="middle">«external system»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-49.4">Mainframe Banking</tspan><tspan x="0" y="-25.4">System</tspan></text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-0.45">Stores all of the core</tspan><tspan x="0" y="19.55">banking information</tspan><tspan x="0" y="39.55">about customers,</tspan><tspan x="0" y="59.55">accounts, transactions,</tspan><tspan x="0" y="79.55">etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-container" data-id="spa" transform="translate(136,419)"><