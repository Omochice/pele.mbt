tainer" data-id="spa" transform="translate(120,747.5)"><rect x="-108" y="-70.5" width="216" height="141" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-45.3" text-anchor="middle">«container»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-22.9">Single-Page App</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-1.95" text-anchor="middle">[JavaScript, Angular]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="20.55">Provides all the Internet banking</tspan><tspan x="0" y="37.55">functionality to customers via</tspan><tspan x="0" y="54.55">their web browser</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-external_container pele-c4-external" data-id="mobile_app" transform="translate(120,985)"><rect x="-108" y="-79" width="216" height="158" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-53.8" text-anchor="middle">«external container»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-31.4">Mobile App</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-10.45" text-anchor="middle">[C#, Xamarin]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="12.05">Provides a limited subset of the</tspan><tspan x="0" y="29.05">Internet banking functionality to</tspan><tspan x="0" y="46.05">customers via their mobile</tspan><tspan x="0" y="63.05">device</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-container" data-id="web_app" transform="translate(120,1214)"><rect x="-108" y="-62" width="216" height="124" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class=