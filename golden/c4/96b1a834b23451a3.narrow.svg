="var(--_m)" x="0" y="-29.8" text-anchor="middle">«external system»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-7.4">E-Mail System</tspan></text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="17.55">The internal Microsoft Exchange</tspan><tspan x="0" y="37.55">system</tspan></text></g><g class="pele-node pele-shape-person pele-c4-person" data-id="customer" transform="translate(108,266)"><rect x="-108" y="-42" width="216" height="110" rx="12" fill="var(--_s)" stroke="var(--_b)"/><circle cy="-54" r="13" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-16.8" text-anchor="middle">«person»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="5.6">Customer</tspan></text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="30.55">A customer of the bank, with</tspan><tspan x="0" y="50.55">personal bank accounts</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-external_system pele-c4-external" data-id="banking_system" transform="translate(108,499)"><rect x="-108" y="-77" width="216" height="154" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-51.8" text-anchor="middle">«external system»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-29.4">Mainframe Banking</tspan><tspan x="0" y="-5.4">System</tspan></text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="19.55">Stores all of the core banking</tspan><tspan x="0" y="39.55">information about customers,</tspan><tspan x="0" y="59.55">accounts, transactions, etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-container" data-id="spa" transform="translate(120,779)"><rect x="-108" y="-75" width="216" height="150" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-49.8" text-anchor="middle">«container»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-27.4">Single-Page App</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-6.45" text-anchor="middle">[JavaScript, Angular]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="17.55">Provides all the Internet banking</tspan><tspan x="0" y="37.55">functionality to customers via</tspan><tspan x="0" y="57.55">their web browser</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-external_container pele-c4-external" data-id="mobile_app" transform="translate(120,1027)"><rect x="-108" y="-85" width="216" height="170" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-59.8" text-anchor="middle">«external container»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-37.4">Mobile App</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-16.45" text-anchor="middle">[C#, Xamarin]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="7.55">Provides a limited subset of the</tspan><tspan x="0" y="27.55">Internet banking functionality to</tspan><tspan x="0" y="47.55">customers via their mobile</tspan><tspan x="0" y="67.55">device</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-container" data-id="web_app" transform="translate(120,1265)"><rect x="-108" y="-65" width="216" height="130" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-39.8" text-anchor="middle">«container»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-17.4">Web Application</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="3.55" text-anchor="middle">[Java, Spring MVC]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="27.55">Delivers the static content and</tspan><tspan x="0" y="47.55">the Internet banking SPA</tspan></text></g><g class="pele-node pele-shape-cyl pele-c4-container_db" data-id="database" transform="translate(120,1505)"><path d="M-108,-75A108,12 0 0 1 108,-75V75A108,12 0 0 1 -108,75Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-108,-75A108,12 0 0 0 108,-75" fill="none" stroke="var(--_b)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-43.8" text-anchor="middle">«container db»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-21.4">Database</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-0.45" text-anchor="middle">[SQL Database]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="23.55">Stores user registration</tspan><tspan x="0" y="43.55">information, hashed auth</tspan><tspan x="0" y="63.55">credentials, access logs, etc.</tspan></text></g><g class="pele-node pele-shape-cyl pele-c4-external_container_db pele-c4-external" data-id="backend_api" transform="translate(120,1757)"><path d="M-108,-65A108,12 0 0 1 108,-65V65A108,12 0 0 1 -108,65Z" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3"/><path d="M-108,-65A108,12 0 0 0 108,-65" fill="none" stroke="var(--_b)" stroke-dasharray="4 3"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-33.8" text-anchor="middle">«external container db»</text>