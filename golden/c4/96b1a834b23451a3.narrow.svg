</tspan></text></g><g class="pele-edge-label" data-id="mobile_app-backend_api"><rect x="-91.26" y="1364" width="92.51" height="60" rx="3" fill="var(--_bg)"/><text x="-45" y="1378.55" text-anchor="middle">Uses</text><text class="pele-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="-45" y="1398.55">[async,</tspan><tspan x="-45" y="1418.55">JSON/HTTPS]</tspan></text></g><g class="pele-edge-label" data-id="database-backend_api"><rect x="43.75" y="1616" width="152.5" height="40" rx="3" fill="var(--_bg)"/><text x="120" y="1630.55" text-anchor="middle">Reads from and writes to</text><text class="pele-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="120" y="1650.55">[sync, JDBC]</tspan></text></g><g class="pele-edge-label" data-id="email_system-customer"><rect x="55.59" y="144.5" width="104.81" height="20" rx="3" fill="var(--_bg)"/><text x="108" y="159.05" text-anchor="middle">Sends e-mails to</text></g><g class="pele-edge-label" data-id="backend_api-email_system"><rect x="-109.18" y="876.5" width="90.36" height="60" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="-64" y="891.05">Sends e-mails</tspan><tspan x="-64" y="911.05">using</tspan></text><text class="pele-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="-64" y="931.05">[sync, SMTP]</tspan></text></g><g class="pele-edge-label" data-id="backend_api-banking_system"><rect x="249.72" y="1104" width="84.57" height="60" rx="3" fill="var(--_bg)"/><text x="292" y="1118.55" text-anchor="middle">Uses</text><text class="pele-c4-techn" fill="var(--_m)" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="292" y="1138.55">[sync/async,</tspan><tspan x="292" y="1158.55">XML/HTTPS]</tspan></text></g></g></g></svg>