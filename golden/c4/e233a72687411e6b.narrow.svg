c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="20.55">Provides all the internet banking</tspan><tspan x="0" y="37.55">functionality to customers via</tspan><tspan x="0" y="54.55">their web browser.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-container" data-id="ma" transform="translate(108,308)"><rect x="-108" y="-79" width="216" height="158" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-53.8" text-anchor="middle">«container»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-31.4">Mobile App</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-10.45" text-anchor="middle">[Xamarin]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="12.05">Provides a limited subset to the</tspan><tspan x="0" y="29.05">internet banking functionality to</tspan><tspan x="0" y="46.05">customers via their mobile</tspan><tspan x="0" y="63.05">device.</tspan></text></g><g class="pele-node pele-shape-cyl pele-c4-container_db" data-id="db" transform="translate(108,566)"><path d="M-108,-79A108,12 0 0 1 108,-79V79A108,12 0 0 1 -108,79Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-108,-79A108,12 0 0 0 108,-79" fill="none" stroke="var(--_b)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-47.8" text-anchor="middle">«container db»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.4">Database</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-4.45" text-anchor="middle">[Relational Database Schema]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="18.05">Stores user registration</tspan><tspan x="0" y="35.05">information, hashed</tspan><tspan x="0" y="52.05">authentication credentials,</tspan><tspan x="0" y="69.05">access logs, etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-external_system pele-c4-external" data-id="mbs" transform="translate(108,814.5)"><rect x="-108" y="-69.5" width="216" height="139" fill="var(--_bg)" stroke="var(--_b)" stroke-dasharray="4 3" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-44.3" text-anchor="middle">«external system»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-23.4">Mainframe Banking</tspan><tspan x="0" y="-2.4">System</tspan></text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="19.55">Stores all of the core banking</tspan><tspan x="0" y="36.55">information about customers,</tspan><tspan x="0" y="53.55">accounts, transactions, etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-component" data-id="sign" transform="translate(120,1074)"><rect x="-108" y="-62" width="216" height="124" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-36.8" text-anchor="middle">«component»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-14.4">Sign In Controller</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="6.55" text-anchor="middle">[MVC Rest Controller]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="29.05">Allows users to sign in to the</tspan><tspan x="0" y="46.05">internet banking system</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-component" data-id="accounts" transform="translate(120,1295)"><rect x="-108" y="-71" width="216" height="142" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-si