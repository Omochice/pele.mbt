<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-quadrantChart" viewBox="0 0 400 400" width="400" height="400" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="quadrantChart"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="200" y="22.6">Reach and engagement of campaigns</tspan></text><g class="pele-quadrants" fill="var(--_s)" stroke="var(--_b)"><g class="pele-quadrant" data-id="1"><rect x="215" y="42" width="177" height="160" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="303.5" y="64.6" text-anchor="middle">We should expand</text></g><g class="pele-quadrant" data-id="2"><rect x="34" y="42" width="177" height="160" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="122.5" y="64.6" text-anchor="middle">Need to promote</text></g><g class="pele-quadrant" data-id="3"><rect x="34" y="206" width="177" height="160" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="122.5" y="228.6" text-anchor="middle">Re-evaluate</text></g><g class="pele-quadrant" data-id="4"><rect x="215" y="206" width="177" height="160" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="303.5" y="228.6" text-anchor="middle">May be improved</text></g></g><g class="pele-axis-labels" font-size="14" fill="var(--_m)"><text x="123.5" y="386.4" text-anchor="middle">Low Reach</text><text x="302.5" y="386.4" text-anchor="middle">High Reach</text><g transform="translate(18.5,285) rotate(-90)"><text x="0" y="4.9" text-anchor="middle">Low Engagement</text></g><g transform="translate(18.5,123) rotate(-90)"><text x="0" y="4.9" text-anchor="middle">High Engagement</text></g></g><g class="pele-points" fill="var(--pele-series-1,#4c78a8)"><circle class="pele-point" data-id="Campaign F" cx="159.3" cy="113.28" r="5"/><circle class="pele-point" data-id="Campaign E" cx="177.2" cy="255.84" r="5"/><circle class="pele-point" data-id="Campaign D" cx="313.24" cy="255.84" r="5"/><circle class="pele-point" data-id="Campaign C" cx="238.06" cy="142.44" r="5"/><circle class="pele-point" data-id="Campaign B" cx="195.1" cy="291.48" r="5"/><circle class="pele-point" data-id="Campaign A" cx="141.4" cy="171.6" r="5"/></g><g class="pele-point-labels" font-size="12"><text class="pele-label" x="141.4" y="193" text-anchor="middle">Campaign A</text><text class="pele-label" x="152.09" y="295.68" text-anchor="middle">Campaign B</text><text class="pele-label" x="281.4" y="146.64" text-anchor="middle">Campaign C</text><text class="pele-label" x="313.24" y="277.24" text-anchor="middle">Campaign D</text><text class="pele-label" x="177.2" y="277.24" text-anchor="middle">Campaign E</text><text class="pele-label" x="159.3" y="134.68" text-anchor="middle">Campaign F</text></g></svg>