<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-swimlane" viewBox="0 0 156 112" width="156" height="112" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="swimlane"><g class="pele-clusters"><g class="pele-cluster pele-lane" data-id="L"><rect x="8" y="8" width="140" height="96" fill="none" stroke="var(--_b)"/><rect x="8" y="8" width="44" height="96" fill="var(--_a)" stroke="var(--_b)"/><g transform="rotate(-90 30 56)"><text class="pele-cluster-label" fill="var(--_m)" style="fill:#c00;" text-anchor="middle" xml:space="preserve"></text><foreignObject class="pele-math" x="24" y="44" width="12" height="24" overflow="visible" color="#c00"><div xmlns="http://www.w3.org/1999/xhtml" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;font-size:16px;line-height:normal;white-space:nowrap"><span data-tex="x">x</span></div></foreignObject></g></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="A" transform="translate(100,56)"><rect x="-24" y="-24" width="48" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">A</text></g></g></svg>