<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-timeline" viewBox="0 0 400 835" width="400" height="835" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="timeline"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="200" y="25.6">England's History Timeline</tspan></text><path class="pele-axis" d="M161,48V820" fill="none" stroke="var(--_l)"/><path class="pele-marker" d="M161,827L157.64,819L164.36,819Z" fill="var(--_l)" stroke="none"/><g class="pele-cluster pele-section" data-id="Stone Age"><rect x="8" y="48" width="384" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="200" y="73.6">Stone Age</tspan></text><g class="pele-node pele-period" data-id="7600 BC"><rect x="8" y="119.5" width="133" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="74.5" y="145.1" text-anchor="middle">7600 BC</text><path class="pele-edge" d="M141,139.5H161M175,139.5H189M161,139.5H175V139.5" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="161" cy="139.5" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="189" y="100" width="203" height="79" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="290.5" y="123.4">Britain's oldest known house</tspan><tspan x="290.5" y="144.4">was built in Orkney,</tspan><tspan x="290.5" y="165.4">Scotland</tspan></text></g></g><g class="pele-node pele-period" data-id="6000 BC"><rect x="8" y="229" width="133" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="74.5" y="254.6" text-anchor="middle">6000 BC</text><path class="pele-edge" d="M141,249H161M175,249H189M161,249H175V249" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="161" cy="249" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="189" y="199" width="203" height="100" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="290.5" y="222.4">Sea levels rise and Britain</tspan><tspan x="290.5" y="243.4">becomes an island.</tspan><tspan x="290.5" y="264.4">The people who live here</tspan><tspan x="290.5" y="285.4">are hunter-gatherers.</tspan></text></g></g></g><g class="pele-cluster pele-section" data-id="Bronze Age"><rect x="8" y="319" width="384" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="200" y="344.6">Bronze Age</tspan></text><g class="pele-node pele-period" data-id="2300 BC"><rect x="8" y="401" width="133" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="74.5" y="426.6" text-anchor="middle">2300 BC</text><path class="pele-edge" d="M141,421H161M175,421H189M175,518.5H189M161,421H175V518.5" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="161" cy="421" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="189" y="371" width="203" height="100" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="290.5" y="394.4">People arrive from Europe</tspan><tspan x="290.5" y="415.4">and settle in Britain.</tspan><tspan x="290.5" y="436.4">They bring farming and</tspan><tspan x="290.5" y="457.4">metalworking.</tspan></text></g><g class="pele-node pele-event"><rect x="189" y="479" width="203" height="79" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="290.5" y="502.4">New styles of pottery and</tspan><tspan x="290.5" y="523.4">ways of burying the dead</tspan><tspan x="290.5" y="544.4">appear.</tspan></text></g></g><g class="pele-node pele-period" data-id="2200 BC"><rect x="8" y="618.5" width="133" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="74.5" y="644.1" text-anchor="middle">2200 BC</text><path class="pele-edge" d="M141,638.5H161M175,638.5H189M175,757H189M161,638.5H175V757" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="161" cy="638.5" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="189" y="578" width="203" height="121" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="290.5" y="601.4">The last major building</tspan><tspan x="290.5" y="622.4">works are completed at</tspan><tspan x="290.5" y="643.4">Stonehenge.</tspan><tspan x="290.5" y="664.4">People now bury their dead</tspan><tspan x="290.5" y="685.4">in stone circles.</tspan></text></g><g class="pele-node pele-event"><rect x="189" y="707" width="203" height="100" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="290.5" y="730.4">The first metal objects are</tspan><tspan x="290.5" y="751.4">made in Britain.Some other</tspan><tspan x="290.5" y="772.4">nice things happen. it is a</tspan><tspan x="290.5" y="793.4">good time to be alive.</tspan></text></g></g></g></svg>