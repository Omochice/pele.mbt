<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-timeline" viewBox="0 0 400 766" width="400" height="766" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="timeline"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="200" y="25.6">England's History Timeline</tspan></text><path class="pele-axis" d="M161,48V751" fill="none" stroke="var(--_l)"/><path class="pele-marker" d="M161,758L157.64,750L164.36,750Z" fill="var(--_l)" stroke="none"/><g class="pele-cluster pele-section" data-id="Stone Age"><rect x="8" y="48" width="384" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="200" y="73.6">Stone Age</tspan></text><g class="pele-node pele-period" data-id="7600 BC"><rect x="8" y="115" width="133" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="74.5" y="140.6" text-anchor="middle">7600 BC</text><path class="pele-edge" d="M141,135H161M175,135H189M161,135H175V135" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="161" cy="135" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="189" y="100" width="203" height="70" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="290.5" y="121.9">Britain's oldest known house</tspan><tspan x="290.5" y="139.9">was built in Orkney,</tspan><tspan x="290.5" y="157.9">Scotland</tspan></text></g></g><g class="pele-node pele-period" data-id="6000 BC"><rect x="8" y="214" width="133" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="74.5" y="239.6" text-anchor="middle">6000 BC</text><path class="pele-edge" d="M141,234H161M175,234H189M161,234H175V234" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="161" cy="234" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="189" y="190" width="203" height="88" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="290.5" y="211.9">Sea levels rise and Britain</tspan><tspan x="290.5" y="229.9">becomes an island.</tspan><tspan x="290.5" y="247.9">The people who live here</tspan><tspan x="290.5" y="265.9">are hunter-gatherers.</tspan></text></g></g></g><g class="pele-cluster pele-section" data-id="Bronze Age"><rect x="8" y="298" width="384" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="200" y="323.6">Bronze Age</tspan></text><g class="pele-node pele-period" data-id="2300 BC"><rect x="8" y="374" width="133" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="74.5" y="399.6" text-anchor="middle">2300 BC</text><path class="pele-edge" d="M141,394H161M175,394H189M175,481H189M161,394H175V481" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="161" cy="394" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="189" y="350" width="203" height="88" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="290.5" y="371.9">People arrive from Europe</tspan><tspan x="290.5" y="389.9">and settle in Britain.</tspan><tspan x="290.5" y="407.9">They bring farming and</tspan><tspan x="290.5" y="425.9">metalworking.</tspan></text></g><g class="pele-node pele-event"><rect x="189" y="446" width="203" height="70" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="290.5" y="467.9">New styles of pottery and</tspan><tspan x="290.5" y="485.9">ways of burying the dead</tspan><tspan x="290.5" y="503.9">appear.</tspan></text></g></g><g class="pele-node pele-period" data-id="2200 BC"><rect x="8" y="569" width="133" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="74.5" y="594.6" text-anchor="middle">2200 BC</text><path class="pele-edge" d="M141,589H161M175,589H189M175,694H189M161,589H175V694" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="161" cy="589" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="189" y="536" width="203" height="106" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="290.5" y="557.9">The last major building</tspan><tspan x="290.5" y="575.9">works are completed at</tspan><tspan x="290.5" y="593.9">Stonehenge.</tspan><tspan x="290.5" y="611.9">People now bury their dead</tspan><tspan x="290.5" y="629.9">in stone circles.</tspan></text></g><g class="pele-node pele-event"><rect x="189" y="650" width="203" height="88" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="290.5" y="671.9">The first metal objects are</tspan><tspan x="290.5" y="689.9">made in Britain.Some other</tspan><tspan x="290.5" y="707.9">nice things happen. it is a</tspan><tspan x="290.5" y="725.9">good time to be alive.</tspan></text></g></g></g></svg>